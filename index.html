<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Device Detection</title>

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #38bdf8;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .label {
            color: #94a3b8;
        }

        span {
            color: #34d399;
            font-weight: 600;
        }

        .ua-container {
            margin-top: 15px;
        }

        small {
            display: block;
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            color: #64748b;
            word-break: break-all;
            max-height: 80px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Device Intelligence</h2>

    <div class="info-row"><span class="label">Operating System:</span> <span id="os">Detecting...</span></div>
    <div class="info-row"><span class="label">Device Type:</span> <span id="device">Detecting...</span></div>
    <div class="info-row"><span class="label">Browser:</span> <span id="browser">Detecting...</span></div>
    
    <div class="ua-container">
        <span class="label">User Agent:</span>
        <small id="ua"></small>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
